name: Supabase MongoDB Migration

on:
  schedule:
    # Every 15 minutes (adjust as needed).
    # NOTE: GitHub Actions cron has minimum granularity of 5 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no deletions)"
        required: false
        default: "false"
        type: boolean
      migration_enabled:
        description: "Enable destructive migration"
        required: false
        default: "true"
        type: boolean

concurrency:
  group: supabase-mongodb-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Capacity Migration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migration
        env:
          # --- Supabase ---
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_MAX_DB_SIZE_BYTES: ${{ secrets.SUPABASE_MAX_DB_SIZE_BYTES }}

          # --- MongoDB ---
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          MONGODB_MAX_SIZE_BYTES: ${{ secrets.MONGODB_MAX_SIZE_BYTES }}
          DESTINATION_SAFE_PCT: ${{ secrets.DESTINATION_SAFE_PCT }}

          # --- Thresholds ---
          START_THRESHOLD: ${{ secrets.START_THRESHOLD }}
          TARGET_THRESHOLD: ${{ secrets.TARGET_THRESHOLD }}
          BATCH_SIZE: ${{ secrets.BATCH_SIZE }}
          MAX_RETRIES: ${{ secrets.MAX_RETRIES }}
          RETRY_DELAY_SECONDS: ${{ secrets.RETRY_DELAY_SECONDS }}

          # --- Feature flags ---
          MIGRATION_ENABLED: ${{ inputs.migration_enabled || secrets.MIGRATION_ENABLED || 'true' }}
          DRY_RUN: ${{ inputs.dry_run || secrets.DRY_RUN || 'false' }}

          # --- AI (optional) ---
          AI_ENABLED: ${{ secrets.AI_ENABLED }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}

        run: python -m src.main

      - name: Migration summary
        if: always()
        run: |
          echo "=== Migration Run Complete ==="
          echo "Status: ${{ job.status }}"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
